<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natureza | Player Acadêmico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Limelight&family=Belleza&family=Josefin+Sans:wght@300;400;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #050505;
            --bg-card: #0d0d0d;
            --accent: #1b4d3e; /* Verde Floresta/Natureza */
            --accent-bright: #2ecc71; /* Verde Esmeralda Ativo */
            --gold: #D4AF37;
            --fg: #F0EDE6;
            --muted: #666;
            --border: rgba(46, 204, 113, 0.2);
            --font-display: 'Limelight', cursive;
            --font-body: 'Josefin Sans', sans-serif;
            --font-btn: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg);
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-body);
            color: var(--fg);
            overflow: hidden;
        }

        .player-shell {
            width: 95%;
            max-width: 1300px;
            height: 90vh;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            display: flex;
            position: relative;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 100px rgba(46, 204, 113, 0.05);
        }

        .nav-back {
            position: absolute;
            top: 30px;
            left: 30px;
            color: var(--accent-bright);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 2px;
            font-weight: 700;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }
        .nav-back:hover { color: #fff; transform: translateX(-5px); }

        /* --- ESQUERDA --- */
        .player-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid var(--border);
            background: radial-gradient(circle at center, #0a1a12 0%, #0a0a0a 100%);
            padding: 40px;
        }

        .vinyl-container {
            position: relative;
            width: 380px;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }

        .disco {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #0e2b1f 0%, #000 70%);
            border-radius: 50%;
            border: 4px solid #0a1a12;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            position: relative;
            animation: rotate 12s linear infinite;
            animation-play-state: paused;
        }

        .disco::after {
            content: ''; position: absolute; inset: 5px; border-radius: 50%;
            background: repeating-radial-gradient(circle, transparent 0, transparent 2px, rgba(255,255,255,0.02) 3px);
        }

        .disco-label {
            position: absolute; width: 110px; height: 110px; background: var(--accent);
            border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border: 8px solid #000; display: flex; align-items: center; justify-content: center;
            font-family: var(--font-display); color: #fff; font-size: 1.2rem; text-align: center; z-index: 2;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .fake-controls { display: flex; gap: 30px; align-items: center; margin-bottom: 20px; }
        .ctrl-btn { background: none; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; transition: 0.3s; }
        .ctrl-btn:hover { color: var(--accent-bright); }
        .play-btn { width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; }

        .visualizer { display: flex; gap: 4px; height: 30px; align-items: flex-end; }
        .bar { width: 4px; background: var(--accent-bright); border-radius: 2px; animation: wave 1s ease-in-out infinite alternate; animation-play-state: paused; }
        @keyframes wave { from { height: 5px; } to { height: 30px; } }

        /* --- DIREITA --- */
        .player-right { flex: 1.5; padding: 50px 60px; display: flex; flex-direction: column; overflow-y: auto; }

        .album-info { margin-bottom: 30px; }
        .album-tag { color: var(--accent-bright); font-size: 0.7rem; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 10px; }
        .album-title { font-family: var(--font-display); font-size: 4rem; margin: 0; color: #fff; line-height: 1; }
        .album-meta { color: var(--muted); font-size: 0.9rem; margin-top: 15px; display: flex; gap: 20px; border-bottom: 1px solid var(--border); padding-bottom: 20px;}

        .trimester-nav { display: flex; gap: 15px; margin-bottom: 30px; }
        .tri-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 8px 15px; border-radius: 20px; cursor: pointer; transition: 0.3s; }
        .tri-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .tri-btn.locked { opacity: 0.3; cursor: not-allowed; }

        .track-item {
            display: flex; align-items: center; padding: 15px 20px; border-radius: 12px;
            margin-bottom: 10px; cursor: pointer; transition: 0.3s; background: rgba(255,255,255,0.02);
        }
        .track-item:hover { background: rgba(46, 204, 113, 0.05); transform: translateX(5px); }
        .track-num { font-family: var(--font-display); color: var(--accent-bright); font-size: 1.5rem; width: 50px; }
        .track-details { flex-grow: 1; }
        .track-details strong { display: block; font-size: 1.1rem; color: #fff; }
        .track-details span { font-size: 0.8rem; color: var(--muted); }

        /* --- DETALHE --- */
        .detail-view { display: none; }
        .btn-back-list { background: rgba(46, 204, 113, 0.1); border: 1px solid var(--accent); color: var(--accent-bright); padding: 8px 15px; border-radius: 20px; cursor: pointer; margin-bottom: 20px; }
        
        .media-container {
            width: 100%; height: 350px; background: #000; border-radius: 15px;
            margin-bottom: 25px; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .media-container img { width: 100%; height: 100%; object-fit: cover; }
        .media-container iframe { width: 100%; height: 100%; border: none; }

        .detail-card { background: #0a110e; padding: 30px; border-radius: 15px; border: 1px solid var(--border); }
        .tag { background: rgba(46, 204, 113, 0.1); color: var(--accent-bright); font-size: 0.7rem; padding: 4px 10px; border-radius: 4px; margin-right: 5px; }
        .detail-card h2 { font-family: var(--font-display); color: #fff; font-size: 2rem; }
        .detail-skill { font-size: 0.85rem; color: var(--accent-bright); border-top: 1px dashed var(--border); margin-top: 20px; padding-top: 20px; line-height: 1.6; }

        .progress-bar { height: 6px; background: #222; border-radius: 3px; margin: 20px 0; position: relative; }
        .progress-fill { height: 100%; background: var(--accent-bright); width: 0%; transition: width 0.8s; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="player-shell">
        <a href="index.html" class="nav-back"><span>&#8592;</span> HOME</a>

        <div class="player-left">
            <div class="vinyl-container">
                <div class="disco" id="vinyl-disc">
                    <div class="disco-label" id="disco-id">1º<br>TRI</div>
                </div>
            </div>
            <div class="fake-controls">
                <button class="ctrl-btn">&#9664;&#9664;</button>
                <button class="ctrl-btn play-btn" id="play-pause-btn">&#9658;</button>
                <button class="ctrl-btn">&#9654;&#9654;</button>
            </div>
            <div class="visualizer">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
        </div>

        <div class="player-right">
            <div class="album-info">
                <p class="album-tag">NATURAL SCIENCES // VOL. 1</p>
                <h1 class="album-title">NATUREZA</h1>
                <div class="album-meta">
                    <span><strong>Autor:</strong> Larissa Amorim</span>
                    <span><strong>Ano:</strong> 2024</span>
                    <span><strong>Gênero:</strong> Vida & Matéria</span>
                </div>
            </div>

            <div class="trimester-nav">
                <button class="tri-btn active">1º Trimestre</button>
                <button class="tri-btn locked">2º Trimestre</button>
                <button class="tri-btn locked">3º Trimestre</button>
            </div>

            <div id="list-view">
                <div class="track-item" onclick="showDetail('nat1')">
                    <span class="track-num">01</span>
                    <div class="track-details">
                        <strong>Combustão e a Dependência Energética </strong>
                        <span>Apresentação • Química</span>
                    </div>
                    <span style="color:var(--accent-bright)">&#9658;</span>
                </div>
                <div class="track-item" onclick="showDetail('nat2')">
                    <span class="track-num">02</span>
                    <div class="track-details">
                        <strong>Meme Evolucionismo</strong>
                        <span>Criação Digital • Biologia</span>
                    </div>
                    <span style="color:var(--accent-bright)">&#9658;</span>
                </div>
                <div class="track-item" onclick="showDetail('nat3')">
                    <span class="track-num">03</span>
                    <div class="track-details">
                        <strong>Relatório: Disputa de Eletricidade</strong>
                        <span>Relatório Prático • Física</span>
                    </div>
                    <span style="color:var(--accent-bright)">&#9658;</span>
                </div>
            </div>

            <div id="detail-view" class="detail-view">
                <button class="btn-back-list" onclick="hideDetail()">&#8592; Voltar à Playlist</button>
                <div class="media-container" id="det-media"></div>
                <div class="detail-card">
                    <div id="det-tags"></div>
                    <h2 id="det-title"></h2>
                    <p id="det-desc"></p>
                    <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
                    <div class="detail-skill" id="det-skill"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const data = {
            'nat1': {
                id: '01',
                title: 'Combustão e a Dependência Energética',
                tags: ['#Química', '#Energia', '#Sustentabilidade'],
                mediaType: 'iframe',
                mediaSrc: 'https://www.canva.com/design/DAHE8hNJVcQ/xuWPmiQMAqVdrltf6kQhvQ/view?embed', 
                desc: 'Nesta atividade, meu grupo investigou por que ainda somos tão dependentes dos combustíveis fósseis. Analisamos a química por trás do rendimento da gasolina, diesel e etanol, comparando o "poder calorífico" de cada um. No fim, discutimos como a economia e o custo-benefício acabam pesando mais do que a ciência ambiental na hora da escolha final.',
                skill: '<strong>C1</strong> - Compreender as ciências naturais e as tecnologias como construções humanas associadas à cultura dos povos e suas visões de mundo.<br><br><strong>H1</strong> - Interpretar informações apresentadas em diferentes linguagens usadas nas Ciências.<br><br><strong>C2</strong> - Aplicar os conceitos fundamentais e estruturas procedimentais das Ciências da Natureza.<br><br><strong>H9</strong> - Explicar os conceitos de energia, matéria, vida e transformação.<br><br><strong>H11</strong> - Empregar procedimentos e práticas de observação, levantamento de hipótese e experimentação.'
            },
            'nat2': {
                id: '02',
                title: 'Meme Evolucionismo',
                tags: ['#Biologia', '#Evolução', '#Ciência'],
                mediaType: 'iframe',
                mediaSrc: 'https://www.canva.com/design/DAHCU9S7Cvk/FPilG8sAVEKvGPEjI4BCmw/view?embed', 
                desc: 'Nesta atividade, em duplas, criamos um meme sobre as teorias do evolucionismo (focando nas ideias de Darwin, Lamarck ou no Neodarwinismo). Fizemos um texto explicativo para detalhar a "piada". Para isso, precisei justificar o meme aplicando corretamente os conceitos biológicos e históricos que aprendi em sala de aula, mostrando que é possível unir o rigor da ciência a uma linguagem digital e acessível.',
                skill: '<strong>C3</strong> - Determinar os impactos das ações humanas nos ambientes, identificando suas causas e propondo soluções para a sua redução.<br><br><strong>H15</strong> - Comparar propostas de intervenção ambiental aplicando conhecimentos científicos e tecnológicos.<br><br><strong>H18</strong> - Identificar situações de risco ambiental na cidade onde reside.'
            },
            'nat3': {
                id: '03',
                title: 'Disputa de Eletricidade',
                tags: ['#Física', '#Eletricidade', '#Relatório'],
                mediaType: 'iframe',
                mediaSrc: 'https://docs.google.com/document/d/1kTzDalGOP2b6cBOh3IGQY-Co7-52qUpF9-9EhVZSupU/preview', 
                desc: 'Realizei este relatório para compreender melhor sobre a disputa por eletricidade. Um experimento foi feito em sala de aula e a partir dele criei o relatório onde explico o que aconteceu.',
                skill: '<strong>C1, C2</strong> - Construções humanas e aplicação de conceitos e estruturas procedimentais das Ciências da Natureza.<br><br><strong>H1, H11, H12</strong> - Interpretar informações, empregar práticas de observação/coleta de dados e relacionar informações para construir modelos.<br><br><strong>H7, H9</strong> - Compreender ramos da Química e explicar os conceitos de energia e transformação de matéria.'
            }
        };

        const vinyl = document.getElementById('vinyl-disc');
        const playBtn = document.getElementById('play-pause-btn');

        function showDetail(id) {
            const item = data[id];
            document.getElementById('det-title').innerText = item.title;
            document.getElementById('det-desc').innerText = item.desc;
            
            // Alterado para innerHTML para suportar as tags <br> e <strong> nas habilidades
            document.getElementById('det-skill').innerHTML = '<span style="color:#fff; font-weight:bold;">Habilidades e Competências:</span><br><br>' + item.skill;
            
            document.getElementById('det-tags').innerHTML = item.tags.map(t => `<span class="tag">${t}</span>`).join('');
            
            const media = document.getElementById('det-media');
            media.innerHTML = item.mediaType === 'image' ? `<img src="${item.mediaSrc}">` : `<iframe src="${item.mediaSrc}"></iframe>`;

            document.getElementById('list-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';
            document.getElementById('disco-id').innerText = item.id;
            
            vinyl.style.animationPlayState = 'running';
            playBtn.innerHTML = '&#10074;&#10074;';
            setTimeout(() => { document.getElementById('prog-fill').style.width = '45%'; }, 100);
        }

        function hideDetail() {
            document.getElementById('list-view').style.display = 'block';
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('disco-id').innerHTML = '1º<br>TRI';
            vinyl.style.animationPlayState = 'paused';
            playBtn.innerHTML = '&#9658;';
            document.getElementById('prog-fill').style.width = '0%';
        }
    </script>
</body>
</html>
